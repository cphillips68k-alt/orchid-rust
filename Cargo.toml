[package]
name = "orchid-kernel"
version = "0.1.0"
authors = ["orchid-rust"]
edition = "2021"
publish = false

[dependencies]
bootloader = "0.11"
x86_64 = { version = "0.15", default-features = false, features = ["instructions"] }
spin = "0.9"
uart_16550 = { version = "0.2", default-features = false }
volatile = { version = "0.5", default-features = false }
lazy_static = { version = "1.4", default-features = false, features = ["spin_no_std"] }
linked_list_allocator = { version = "0.10", default-features = false }
pic8259_simple = "0.2"

[dev-dependencies]
bootimage = "0.10"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
