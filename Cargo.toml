[package]
name = "orchid-kernel"
version = "0.1.0"
authors = ["orchid-rust"]
edition = "2021"
publish = false

[dependencies]
bootloader = { version = "0.11", features = ["binary"] }
x86_64 = "0.15"
spin = "0.9"
uart_16550 = "0.2"
volatile = "0.5"
lazy_static = "1.4"
linked_list_allocator = "0.10"
pic8259_simple = "0.2"

[dev-dependencies]
bootimage = "0.10"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
