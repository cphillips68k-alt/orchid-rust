[package]
name = "orchid-kernel"
version = "0.1.0"
authors = ["orchid-rust"]
edition = "2021"
publish = false

[dependencies]
# Existing pins
serde = { version = "=1.0.210", default-features = false, features = ["derive"] }
serde_json = { version = "=1.0.128", default-features = false, features = ["alloc"] }
bincode = { version = "2.0.0-rc.3", default-features = false, features = ["serde"] }

# Explicitly pin bitvec to 1.0.0 to avoid the 1.0.1 doc macro mess
bitvec = { version = "=1.0.0", default-features = false, features = ["alloc"] }

# Standard kernel deps
bootloader = "0.11"
x86_64 = { version = "0.15", default-features = false, features = ["instructions"] }
spin = { version = "0.9", default-features = false }
uart_16550 = { version = "0.2", default-features = false }
volatile = { version = "0.5", default-features = false }
getrandom = "0.2"

[dev-dependencies]
bootimage = "0.10"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
